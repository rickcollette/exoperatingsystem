<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="white"/>
<text x="10" y="24" font-size="16" font-weight="bold">The DOS's own time (Altirra's standard drive, no rotation timing)</text>
<text x="10" y="44" fill="#555">time against SDX's for the same job (SDX = 100%, shorter is faster); frames (1/60 s) at each bar</text>
<rect x="10" y="56" width="12" height="12" fill="#c0392b"/>
<text x="26" y="67">SDX 4.50, SDFS</text>
<rect x="138" y="56" width="12" height="12" fill="#95a5a6"/>
<text x="154" y="67">EOS, SDFS</text>
<rect x="231" y="56" width="12" height="12" fill="#2471a3"/>
<text x="247" y="67">EOS, EOSFS</text>
<line x1="660.0" y1="80" x2="660.0" y2="362" stroke="#999" stroke-dasharray="4 3"/>
<text x="660.0" y="376" fill="#777" text-anchor="middle">100%</text>
<text x="222" y="117" text-anchor="end">Copy a 40 KB file</text>
<rect x="230" y="88" width="430.0" height="15" fill="#c0392b"/>
