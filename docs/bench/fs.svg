<text x="585.2" y="136" fill="#222">588 (81%)</text>
<text x="222" y="185" text-anchor="end">List 60 files (DIR)</text>
<rect x="230" y="156" width="430.0" height="15" fill="#c0392b"/>
<text x="665.0" y="168" fill="#222">324 (100%)</text>
<rect x="230" y="174" width="260.1" height="15" fill="#95a5a6"/>
